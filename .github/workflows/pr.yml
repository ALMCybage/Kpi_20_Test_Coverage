name: PR Validation (Build, Test & SonarCloud Quality Gate)

# Runs on every pull request that targets main.
# Builds, runs tests with coverage, sends results to SonarCloud, and fails the
# check if the SonarCloud Quality Gate does not pass (sonar.qualitygate.wait).
#adding comment 
on:
  pull_request:
    branches:
      - main

# Needed so the PR-decoration step can post/update a comment on the PR.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Full history so SonarCloud can compute new-code / PR diffs accurately.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1.2

    - name: Setup .NET (for global tools)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarScanner and coverage tools
      shell: powershell
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet tool install --global dotnet-coverage

    # Find the solution file automatically
    - name: Locate Solution File
      id: solution
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1

        if ($null -eq $sln) {
          Write-Host "No solution file found."
          exit 1
        }

        Write-Host "Solution Found:"
        Write-Host $sln.FullName

        echo "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV

    - name: Restore NuGet Packages
      shell: powershell
      run: |
        nuget restore "$env:SOLUTION"

    # SonarScanner must "begin" BEFORE the build so it can hook into MSBuild.
    # The scanner auto-detects PR context (key/branch/base) from GitHub Actions,
    # so no sonar.pullrequest.* parameters are needed here.
    # sonar.qualitygate.wait=true makes the "end" step block until SonarCloud
    # finishes analysis and fail the job if the Quality Gate is red.
    - name: SonarScanner Begin
      shell: powershell
      run: |
        dotnet-sonarscanner begin `
          /o:"almcybage" `
          /k:"almcybage_kpi-20-test-coverage" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.token="6e1bb943a2b4735b188bfc40614dd773446a5af8" `
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
          /d:sonar.qualitygate.wait=true `
          /d:sonar.exclusions="**/Scripts/**,**/Content/**,**/fonts/**,**/*.min.js,**/*.min.css,**/bin/**,**/obj/**" `
          /d:sonar.coverage.exclusions="**/Scripts/**,**/Content/**,**/fonts/**,**/App_Start/**,**/Global.asax*,**/Views/**,**/*.Tests/**"

    - name: Build Solution
      shell: powershell
      run: |
        msbuild "$env:SOLUTION" `
          /t:Rebuild `
          /p:Configuration=Release

    # Run MSTest through dotnet-coverage so we get a VS coverage XML report
    # that SonarCloud imports via sonar.cs.vscoveragexml.reportsPaths.
    - name: Run Tests with Coverage
      shell: powershell
      run: |
        $testDll = Get-ChildItem -Recurse -Filter *.Tests.dll |
          Where-Object { $_.FullName -match "\\bin\\Release\\" } |
          Select-Object -First 1

        if ($null -eq $testDll) {
          Write-Host "No test assembly found."
          exit 1
        }

        Write-Host "Test assembly: $($testDll.FullName)"

        dotnet-coverage collect "vstest.console.exe `"$($testDll.FullName)`"" -f xml -o coverage.xml

    # SonarScanner "end" uploads results and (because of qualitygate.wait)
    # polls the Quality Gate, returning a non-zero exit code if it fails.
    - name: SonarScanner End
      shell: powershell
      run: |
        dotnet-sonarscanner end /d:sonar.token="6e1bb943a2b4735b188bfc40614dd773446a5af8"


    # ----------------------------------------------------------------------
    # Manish's PR-decoration logic, adapted to this project:
    #   - Pull PR metrics/issues from SonarCloud
    #   - Build a Markdown summary
    #   - Post (or update) it as a comment on the PR
    # Runs even when the Quality Gate fails, so the summary always appears.
    # The Python heredoc needs bash (PowerShell is the Windows default shell).
    # ----------------------------------------------------------------------
    - name: Build SonarCloud PR decoration comment
      if: always()
      shell: bash
      env:
        SONAR_TOKEN: "6e1bb943a2b4735b188bfc40614dd773446a5af8"
        SONAR_PROJECT_KEY: almcybage_kpi-20-test-coverage
        SONAR_HOST_URL: https://sonarcloud.io
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python - << 'PY'
        import json
        import os
        import base64
        import urllib.request

        host = os.environ["SONAR_HOST_URL"]
        project = os.environ["SONAR_PROJECT_KEY"]
        pr = os.environ["PR_NUMBER"]
        token = os.environ["SONAR_TOKEN"]

        def call(path):
            url = f"{host}{path}"
            req = urllib.request.Request(url)
            auth = (token + ":").encode("utf-8")
            req.add_header("Authorization", "Basic " + base64.b64encode(auth).decode("utf-8"))
            with urllib.request.urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode("utf-8"))

        def measure_value(m):
            # New-code metrics (e.g. new_coverage) return their value under
            # "period"/"periods", NOT "value" -- read whichever is present.
            if m.get("value") is not None:
                return m["value"]
            p = m.get("period")
            if isinstance(p, dict) and p.get("value") is not None:
                return p["value"]
            ps = m.get("periods")
            if isinstance(ps, list) and ps and ps[0].get("value") is not None:
                return ps[0]["value"]
            return None

        measures = call(
            "/api/measures/component?component=" + project
            + "&pullRequest=" + pr
            + "&metricKeys=new_coverage"
        )

        metrics = {m["metric"]: measure_value(m) for m in measures.get("component", {}).get("measures", [])}
        new_coverage = metrics.get("new_coverage")

        lines = []
        lines.append("<!-- sonar-pr-decoration -->")
        lines.append("## SonarCloud PR Analysis")
        lines.append("")
        lines.append(f"- New Coverage: **{new_coverage + '%' if new_coverage is not None else 'N/A'}**")

        with open("sonar_pr_comment.md", "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")
        PY

    - name: Publish SonarCloud PR decoration comment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- sonar-pr-decoration -->';
          const body = fs.readFileSync('sonar_pr_comment.md', 'utf8');

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }
