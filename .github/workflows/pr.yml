# Combined GitHub Actions workflow
# NOTE: Replace SONAR_HOST_URL only if using self-hosted SonarQube.
name: PR Validation (Build, Test & SonarCloud Quality Gate)

on:
  pull_request:
    branches:
     - master
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - uses: darenm/Setup-VSTest@v1.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - shell: powershell
        name: Install Sonar Tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Locate Solution
        shell: powershell
        run: |
          $sln=Get-ChildItem -Recurse -Filter *.sln|Select-Object -First 1
          if($null -eq $sln){exit 1}
          echo "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        shell: powershell
        run: nuget restore "$env:SOLUTION"

      - name: Sonar Begin
        shell: powershell
        run: |
          dotnet-sonarscanner begin `
            /o:"almcybage" `
            /k:"almcybage_kpi-20-test-coverage" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="6e1bb943a2b4735b188bfc40614dd773446a5af8" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.qualitygate.wait=true

      - name: Build
        shell: powershell
        run: msbuild "$env:SOLUTION" /t:Rebuild /p:Configuration=Release

      - name: Test with Coverage
        shell: powershell
        run: |
          $dll=Get-ChildItem -Recurse -Filter *.Tests.dll|?{$_.FullName -match "\\bin\\Release\\"}|select -First 1
          dotnet-coverage collect "vstest.console.exe `"$($dll.FullName)`"" -f xml -o coverage.xml

      - name: Sonar End
        shell: powershell
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Build Sonar PR Comment
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: almcybage_kpi-20-test-coverage
          SONAR_HOST_URL: https://sonarcloud.io
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - << 'PY'
          import json,os,urllib.request,base64
          h=os.environ["SONAR_HOST_URL"];p=os.environ["SONAR_PROJECT_KEY"];pr=os.environ["PR_NUMBER"];t=os.environ["SONAR_TOKEN"]
          def call(path):
              r=urllib.request.Request(h+path)
              r.add_header("Authorization","Basic "+base64.b64encode((t+":").encode()).decode())
              return json.loads(urllib.request.urlopen(r).read().decode())
          m=call(f"/api/measures/component?component={p}&pullRequest={pr}&metricKeys=alert_status,new_bugs,new_vulnerabilities,new_code_smells,new_security_hotspots,new_coverage,new_duplicated_lines_density")
          metrics={x["metric"]:x.get("value","-") for x in m["component"]["measures"]}
          lines=["<!-- sonar-pr-decoration -->","## SonarCloud PR Analysis","",f"- Quality Gate: **{metrics.get('alert_status')}**",f"- Coverage: **{metrics.get('new_coverage')}%**",f"- Duplication: **{metrics.get('new_duplicated_lines_density')}%**","",f"[Open Dashboard]({h}/dashboard?id={p}&pullRequest={pr})"]
          open("sonar_pr_comment.md","w").write("\n".join(lines))
          PY

      - name: Publish Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const body=fs.readFileSync('sonar_pr_comment.md','utf8');
            const marker='<!-- sonar-pr-decoration -->';
            const {owner,repo}=context.repo;
            const issue_number=context.issue.number;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number});
            const existing=comments.find(c=>c.user?.type==='Bot'&&c.body?.includes(marker));
            if(existing){
              await github.rest.issues.updateComment({owner,repo,comment_id:existing.id,body});
            }else{
              await github.rest.issues.createComment({owner,repo,issue_number,body});
            }
