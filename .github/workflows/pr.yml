name: PR Validation (Build, Test & SonarCloud Quality Gate)

# Runs on every pull request that targets main.
# Builds, runs tests with coverage, sends results to SonarCloud, and fails the
# check if the SonarCloud Quality Gate does not pass (sonar.qualitygate.wait).
on:
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Full history so SonarCloud can compute new-code / PR diffs accurately.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup VSTest
      uses: darenm/Setup-VSTest@v1.2

    - name: Setup .NET (for global tools)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~\sonar\cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarScanner and coverage tools
      shell: powershell
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet tool install --global dotnet-coverage

    # Find the solution file automatically
    - name: Locate Solution File
      id: solution
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1

        if ($null -eq $sln) {
          Write-Host "No solution file found."
          exit 1
        }

        Write-Host "Solution Found:"
        Write-Host $sln.FullName

        echo "SOLUTION=$($sln.FullName)" >> $env:GITHUB_ENV

    - name: Restore NuGet Packages
      shell: powershell
      run: |
        nuget restore "$env:SOLUTION"

    # SonarScanner must "begin" BEFORE the build so it can hook into MSBuild.
    # The scanner auto-detects PR context (key/branch/base) from GitHub Actions,
    # so no sonar.pullrequest.* parameters are needed here.
    # sonar.qualitygate.wait=true makes the "end" step block until SonarCloud
    # finishes analysis and fail the job if the Quality Gate is red.
    - name: SonarScanner Begin
      shell: powershell
      run: |
        dotnet-sonarscanner begin `
          /o:"almcybage" `
          /k:"almcybage_kpi-20-test-coverage" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.token="6e1bb943a2b4735b188bfc40614dd773446a5af8" `
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
          /d:sonar.qualitygate.wait=true `
          /d:sonar.exclusions="**/Scripts/**,**/Content/**,**/fonts/**,**/*.min.js,**/*.min.css,**/bin/**,**/obj/**" `
          /d:sonar.coverage.exclusions="**/Scripts/**,**/Content/**,**/fonts/**,**/App_Start/**,**/Global.asax*,**/Views/**,**/*.Tests/**"

    - name: Build Solution
      shell: powershell
      run: |
        msbuild "$env:SOLUTION" `
          /t:Rebuild `
          /p:Configuration=Release

    # Run MSTest through dotnet-coverage so we get a VS coverage XML report
    # that SonarCloud imports via sonar.cs.vscoveragexml.reportsPaths.
    - name: Run Tests with Coverage
      shell: powershell
      run: |
        $testDll = Get-ChildItem -Recurse -Filter *.Tests.dll |
          Where-Object { $_.FullName -match "\\bin\\Release\\" } |
          Select-Object -First 1

        if ($null -eq $testDll) {
          Write-Host "No test assembly found."
          exit 1
        }

        Write-Host "Test assembly: $($testDll.FullName)"

        dotnet-coverage collect "vstest.console.exe `"$($testDll.FullName)`"" -f xml -o coverage.xml

    # SonarScanner "end" uploads results and (because of qualitygate.wait)

    # polls the Quality Gate, returning a non-zero exit code if it fails.
    - name: SonarScanner End
      shell: powershell
      run: |
        dotnet-sonarscanner end /d:sonar.token="6e1bb943a2b4735b188bfc40614dd773446a5af8"

    - name: Read OpenCover Coverage
      if: always()
      shell: powershell
      run: |
        # abc.ps1

        # ----------------------------
        # Configuration
        # ----------------------------
        $GitHubToken = "*****"
        $SonarToken  = "*****"

        $ProjectKey = "almcybage_kpi-20-test-coverage"

        # ----------------------------
        # GitHub Environment
        # ----------------------------
        $event = Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json

        $PrNumber = $event.pull_request.number
        $CurrentSha = $env:GITHUB_SHA

        $repoInfo = $env:GITHUB_REPOSITORY.Split("/")
        $Org = $repoInfo[0]
        $Repo = $repoInfo[1]

        Write-Host "===================================="
        Write-Host "Organization : $Org"
        Write-Host "Repository   : $Repo"
        Write-Host "PR Number    : $PrNumber"
        Write-Host "Current SHA  : $CurrentSha"
        Write-Host "===================================="

        # ----------------------------
        # GitHub Headers
        # ----------------------------
        $ghHeaders = @{
          Authorization = "Bearer $GitHubToken"
          Accept = "application/vnd.github+json"
        }

        # ----------------------------
        # Sonar Headers
        # ----------------------------
        $auth = [Convert]::ToBase64String(
          [System.Text.Encoding]::ASCII.GetBytes("${SonarToken}:")
        )

        $sonarHeaders = @{
          Authorization = "Basic $auth"
        }

        # ----------------------------
        # Fetch PR Commits
        # ----------------------------
        $commitUrl = "https://api.github.com/repos/$Org/$Repo/pulls/$PrNumber/commits"

        Write-Host ""
        Write-Host "Fetching PR commits..."
        Write-Host $commitUrl

        try {
          $commits = Invoke-RestMethod `
            -Uri $commitUrl `
            -Headers $ghHeaders `
            -Method Get
        }
        catch {
          Write-Host "Unable to fetch commits."
          Write-Host $_.Exception.Message
          exit 1
        }

        Write-Host ""
        Write-Host "========= PR COMMITS ========="

        foreach ($commit in $commits) {
          Write-Host "---------------------------------------"
          Write-Host "SHA     : $($commit.sha)"
          Write-Host "Author  : $($commit.commit.author.name)"
          Write-Host "Message : $($commit.commit.message)"
        }

        Write-Host "======================================="

        # ----------------------------
        # Wait For Sonar Analysis
        # ----------------------------
        Write-Host ""
        Write-Host "Waiting for SonarCloud analysis..."

        $Matched = $false

        for ($i = 1; $i -le 20; $i++) {

          Write-Host ""
          Write-Host "Attempt $i"

          try {
            $analysisUrl = "https://sonarcloud.io/api/project_analyses/search?project=$ProjectKey&ps=1"

            $analysis = Invoke-RestMethod `
              -Uri $analysisUrl `
              -Headers $sonarHeaders `
              -Method Get

            if ($analysis.analyses.Count -gt 0) {

              $Revision = $analysis.analyses[0].revision

              Write-Host "Sonar Revision : $Revision"

              if ($Revision -eq $CurrentSha) {
                Write-Host "Matching Analysis Found."
                $Matched = $true
                break
              }
              else {
                Write-Host "Latest Sonar analysis belongs to another commit."
              }
            }
            else {
              Write-Host "No Sonar analysis available."
            }
          }
          catch {
            Write-Host $_.Exception.Message
          }

          Start-Sleep -Seconds 10
        }

        if (!$Matched) {
          Write-Host ""
          Write-Host "Matching Sonar analysis not found."
          exit 0
        }

        # ----------------------------
        # Fetch Coverage
        # ----------------------------
        Write-Host ""
        Write-Host "Fetching Coverage..."

        $measureUrl = "https://sonarcloud.io/api/measures/component?component=$ProjectKey&metricKeys=coverage,new_coverage,alert_status"

        try {
          $measure = Invoke-RestMethod `
            -Uri $measureUrl `
            -Headers $sonarHeaders `
            -Method Get
        }
        catch {
          Write-Host $_.Exception.Message
          exit 1
        }

        Write-Host ""
        Write-Host "========== SONAR METRICS =========="

        foreach ($m in $measure.component.measures) {
          Write-Host "$($m.metric) : $($m.value)"
        }

        Write-Host "=================================="
        Write-Host ""
        Write-Host "Script completed successfully."
