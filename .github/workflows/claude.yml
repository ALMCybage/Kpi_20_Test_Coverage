name: Claude Code

on:
  workflow_dispatch:

  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

  issues:
    types: [opened, assigned]

  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Run only when @claude is mentioned
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          claude_args: |
            --model claude-sonnet-4-5
            --allowedTools "Bash(git:*),Bash(gh:*),Edit,Write"

      - name: Create Pull Request automatically
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
        run: |
          echo "Claude branch: $BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Claude: Automated changes" \
            --body "This PR was automatically created from Claude's changes."












