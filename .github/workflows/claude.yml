name: Claude Code

on:
  workflow_dispatch:

  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

  issues:
    types: [opened, assigned]

  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.SURAJ_CLAUDE_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: |
            --model claude-4-0-sonnet-20250805
